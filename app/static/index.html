<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Voice RAG — HH Goa Task 2</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1115; --card:#171a21; --accent:#6c8cff; --text:#e6e8ee; --muted:#8a90a2; --ok:#3ecf8e; --warn:#f5a623; --err:#f0556c; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); padding:24px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
  .card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  button { background: var(--accent); color: white; border: none; border-radius: 8px; padding: 10px 18px; font-size: 0.95rem; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: transparent; border: 1px solid #333a4a; }
  input[type=text] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333a4a; background: #0f1115; color: var(--text); font-size: 0.95rem; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
  .status { font-size: 0.85rem; padding: 3px 10px; border-radius: 999px; display: inline-block; }
  .status.ok { background: rgba(62,207,142,0.15); color: var(--ok); }
  .status.refused { background: rgba(245,166,35,0.15); color: var(--warn); }
  .status.error { background: rgba(240,85,108,0.15); color: var(--err); }
  .answer { margin-top: 14px; line-height: 1.5; }
  .meta { margin-top: 14px; font-size: 0.8rem; color: var(--muted); }
  .sources { margin-top: 10px; font-size: 0.82rem; color: var(--muted); }
  .sources div { padding: 6px 0; border-top: 1px solid #262b38; }
  #recBtn.recording { background: var(--err); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Voice RAG — HH Goa Task 2</h1>
  <div class="sub">Speak or type a question. Pipeline: STT (Sarvam) → hybrid BM25/TF-IDF retrieval → guarded Claude generation.</div>

  <div class="card">
    <div class="row">
      <button id="recBtn">🎙 Record</button>
      <span id="recStatus" style="color:var(--muted); font-size:0.85rem;"></span>
    </div>
    <div class="row">
      <input type="text" id="textInput" placeholder="...or type a question and press Enter">
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <span id="statusBadge" class="status"></span>
    <div class="answer" id="answerText"></div>
    <div class="sources" id="sourcesBox"></div>
    <div class="meta" id="metaBox"></div>
  </div>
</div>

<script>
const recBtn = document.getElementById('recBtn');
const recStatus = document.getElementById('recStatus');
const textInput = document.getElementById('textInput');
const resultCard = document.getElementById('resultCard');
const statusBadge = document.getElementById('statusBadge');
const answerText = document.getElementById('answerText');
const sourcesBox = document.getElementById('sourcesBox');
const metaBox = document.getElementById('metaBox');

let mediaRecorder, chunks = [], recording = false;

function renderResult(data) {
  resultCard.style.display = 'block';
  statusBadge.className = 'status ' + data.status;
  statusBadge.textContent = data.status.toUpperCase();
  if (data.status === 'ok') {
    answerText.textContent = data.answer;
  } else if (data.status === 'refused') {
    answerText.textContent = 'Refused: ' + data.refusal_reason;
  } else {
    answerText.textContent = 'Error: ' + data.error;
  }
  sourcesBox.innerHTML = (data.retrieved_sources || []).map(s =>
    `<div><b>${s.chunk_id}</b> (score ${s.score}) — ${s.text}</div>`).join('');
  metaBox.textContent = `total: ${data.total_ms}ms — stages: ` +
    Object.entries(data.timings || {}).map(([k,v]) => `${k}=${v.toFixed(2)}ms`).join(', ');
}

async function sendText(query) {
  const res = await fetch('/api/query/text', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({query})
  });
  renderResult(await res.json());
}

async function sendAudio(blob) {
  const form = new FormData();
  form.append('file', blob, 'query.webm');
  const res = await fetch('/api/query/voice', { method: 'POST', body: form });
  renderResult(await res.json());
}

textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && textInput.value.trim()) {
    sendText(textInput.value.trim());
  }
});

recBtn.addEventListener('click', async () => {
  if (!recording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      chunks = [];
      mediaRecorder.ondataavailable = e => chunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'audio/webm' });
        sendAudio(blob);
        stream.getTracks().forEach(t => t.stop());
      };
      mediaRecorder.start();
      recording = true;
      recBtn.classList.add('recording');
      recBtn.textContent = '⏹ Stop';
      recStatus.textContent = 'Recording...';
    } catch (err) {
      recStatus.textContent = 'Mic access denied or unavailable: ' + err.message;
    }
  } else {
    mediaRecorder.stop();
    recording = false;
    recBtn.classList.remove('recording');
    recBtn.textContent = '🎙 Record';
    recStatus.textContent = 'Processing...';
  }
});
</script>
</body>
</html>
